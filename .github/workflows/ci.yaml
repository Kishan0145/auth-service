name : Auth Service CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  build-and-test:
    name: Build and Test
    runs-on: ubuntu-latest
    steps:
      - name : Checkout code
        uses: actions/checkout@v6
      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version-file: .nvmrc
      - name: Install dependencies
        run: npm ci
      - name: Run lint
        run: npm run lint
      - name: Debug DB connection
        run: |
          echo "DB_HOST length: ${#DB_HOST}"
          echo "DB_PORT: $DB_PORT"
          echo "POSTGRES_DB length: ${#POSTGRES_DB}"
          echo "POSTGRES_USERNAME length: ${#POSTGRES_USERNAME}"
          node -e "require('dns').lookup(process.env.DB_HOST, {family:4}, (e,a) => console.log('DNS IPv4:', e ? e.message : a))"
        env:
          DB_HOST: ${{ secrets.TEST_DB_HOST }}
          DB_PORT: ${{ secrets.TEST_DB_PORT }}
          POSTGRES_DB: ${{ secrets.TEST_DB_NAME }}
          POSTGRES_USERNAME: ${{ secrets.TEST_DB_USER }}
      - name: Run tests
        run: npm test
        env:
          NODE_ENV: test
          DB_HOST: ${{ secrets.TEST_DB_HOST }}
          DB_PORT: ${{ secrets.TEST_DB_PORT }}
          POSTGRES_DB: ${{ secrets.TEST_DB_NAME }}
          POSTGRES_USERNAME: ${{ secrets.TEST_DB_USER }}
          POSTGRES_PASSWORD: ${{ secrets.TEST_DB_PASSWORD }}
          JWT_SECRET: ${{ secrets.JWT_SECRET }}
          PRIVATE_KEY: ${{ secrets.PRIVATE_KEY }}
      - name: Build project
        run: npm run build
      - name : Sonar Scanner
        uses: SonarSource/sonarcloud-github-action@master
        env :
          SONAR_TOKEN : ${{ secrets.SONAR_TOKEN }}
  build-and-push-docker:
    name: Build and Push Docker Image
    runs-on: ubuntu-latest
    needs: build-and-test
    steps:
      - name : Checkout code
        uses: actions/checkout@v6
      - name: Log in to Docker Hub
        uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}
      - name: Set up Buildx
        uses: docker/setup-buildx-action@v4
      - name: Build and push Docker image
        uses: docker/build-push-action@v7
        with:
          push: true
          tags: ${{ secrets.DOCKER_USERNAME }}/auth-service:${{ github.run_number }}
          file: ./Dockerfile.production
